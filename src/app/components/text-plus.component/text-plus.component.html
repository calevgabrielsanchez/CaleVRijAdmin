<div class="barra-herramientas">
  <div class="grupo-izquierdo">
    <button type="button" [class.active-view]="code" title="Vista pergamino" aria-label="Vista pergamino" [attr.aria-pressed]="code" (click)="convertirPergamino()"><svg viewBox="0 0 24 24"><path d="M5 4h13a2 2 0 0 1 2 2v14H7a3 3 0 0 1-3-3V6a2 2 0 0 1 2-2Z"/><path d="M7 4v13a3 3 0 0 0 3 3M9 8h7M9 12h7"/></svg></button>
    <button type="button" [class.active-view]="!code" title="Editar código" aria-label="Editar código" [attr.aria-pressed]="!code" (click)="convertirCodigo()"><svg viewBox="0 0 24 24"><path d="m8 5-6 7 6 7M16 5l6 7-6 7M14 3l-4 18"/></svg></button>
  </div>
  <div class="grupo-centro"><button type="button" title="Guardar y aceptar" aria-label="Guardar y aceptar" (click)="guardarYAceptar()"><svg viewBox="0 0 24 24"><path d="M20 11v1a8 8 0 1 1-4-6.9"/><path d="m8 11 4 4L22 5"/></svg></button></div>
  <div class="grupo-derecho"><button type="button" title="Ayuda" aria-label="Ayuda" (click)="onHelp()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.6 9a2.5 2.5 0 1 1 4.5 1.5c-1 1.2-2.1 1.3-2.1 3M12 17h.01"/></svg></button></div>
  <div class="grupo-derecho"><button type="button" title="Cerrar" aria-label="Cerrar" (click)="cerrar.emit()"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
</div>
@if (!code) {
  <div class="barra-formatos" aria-label="Formatos de texto">
    <button type="button" title="Título" aria-label="Insertar título" (click)="insertarPrefijo('#')">H1</button>
    <button type="button" title="Subtítulo" aria-label="Insertar subtítulo" (click)="insertarPrefijo('##')">H2</button>
    <button type="button" title="Negrita" aria-label="Insertar negrita" (click)="envolverTexto('**', '**')"><strong>B</strong></button>
    <button type="button" title="Cursiva" aria-label="Insertar cursiva" (click)="envolverTexto('*', '*')"><em>I</em></button>
    <button type="button" title="Lista" aria-label="Insertar lista" (click)="insertarPrefijo('-')">Lista</button>
    <button type="button" title="Elemento de lista" aria-label="Insertar elemento de lista" (click)="insertarPrefijo('--')">Elemento</button>
    <button type="button" title="Enlace" aria-label="Insertar enlace" (click)="insertarPrefijo('#/')">Enlace</button>
    <button type="button" title="Imagen" aria-label="Insertar imagen" (click)="insertarPrefijo('@/')">Imagen</button>
    <button type="button" title="Cita" aria-label="Insertar cita" (click)="envolverTexto('(/', ')')">Cita</button>
    <button type="button" title="Aviso" aria-label="Insertar aviso" (click)="envolverTexto('(#', ')')">Aviso</button>
    <button type="button" title="Alerta" aria-label="Insertar alerta" (click)="envolverTexto('(@', ')')">Alerta</button>
    <button type="button" title="Éxito" aria-label="Insertar mensaje de éxito" (click)="envolverTexto('(!', ')')">Éxito</button>
    <button type="button" title="Default" aria-label="Insertar bloque default" (click)="envolverTexto('(?', ')')">Default</button>
    <button type="button" title="Tabla" aria-label="Insertar tabla" (click)="insertarTabla()">Tabla</button>
  </div>
}
<textarea #editor class="cuadro-completo" [class.hide]="code" placeholder="Escribe aquí..." [value]="textoArea" (input)="textoArea = $any($event.target).value; actualizarVistaPergamino()"></textarea>
<div contenteditable="false" class="cuadro-completo pergamino" [class.hide]="!code" [innerHTML]="vistaPergamino"></div>
